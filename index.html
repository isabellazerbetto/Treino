<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" content="#e4572e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏃%3C/text%3E%3C/svg%3E">
<title>Meu plano de treino</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e4e2db;
    --accent: #e4572e; --accent-lt: #ffc2ad; --accent-soft: #fde8e0;
    --str: #3b5bdb; --str-soft: #e7ecff;
    --run: #e4572e; --run-soft: #fde8e0;
    --mob: #2b9a66; --mob-soft: #e0f5ea;
    --neutral-soft: #efeee9;
    --gold: #f2b01e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --card: #1e1e1c; --text: #f2f1ec; --muted: #9c9a93; --line: #333330;
      --accent-soft: #3a211a; --accent-lt: #7a3a28; --str: #7b97ff; --str-soft: #1f2644; --run: #ff8a65; --run-soft: #3a211a;
      --mob: #4cc790; --mob-soft: #173326; --neutral-soft: #262624;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --card: #1e1e1c; --text: #f2f1ec; --muted: #9c9a93; --line: #333330;
    --accent-soft: #3a211a; --accent-lt: #7a3a28; --str: #7b97ff; --str-soft: #1f2644; --run: #ff8a65; --run-soft: #3a211a;
    --mob: #4cc790; --mob-soft: #173326; --neutral-soft: #262624;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  /* HERO */
  .hero { flex: 0 0 100%; scroll-snap-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
  .hero-top { display: flex; align-items: center; gap: 12px; }
  .rank-emoji { font-size: 34px; line-height: 1; }
  .rank small, .xp small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .rank b { font-size: 19px; letter-spacing: -0.01em; }
  .xp { margin-left: auto; text-align: right; }
  .xp b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .big-bar { height: 16px; background: var(--neutral-soft); border-radius: 99px; overflow: hidden; margin-top: 14px; position: relative; }
  .big-bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .4s ease;
    background: linear-gradient(90deg, var(--accent-lt), var(--accent)); }
  .big-bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--card); opacity: .85; }
  .hero-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .hero-meta b { color: var(--text); }
  .prev { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); display: none; }

  /* NAV */
  nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); padding: 10px 0 0; margin: 12px -16px 0; border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; min-width: 50px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 7px 10px 8px; font: inherit; cursor: pointer; text-align: center; position: relative; overflow: hidden;
  }
  .tab small { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tab b { font-size: 17px; }
  .tab .mini { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--mob); width: 0; transition: width .3s; }
  .tab[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tab[aria-selected="true"] small { color: var(--bg); opacity: .7; }
  .tab.done { border-color: var(--mob); }
  .tab.done b::after { content: " ✓"; font-size: 12px; color: var(--mob); }
  .tab[aria-selected="true"].done b::after { color: var(--bg); }
  .wk { height: 3px; background: var(--line); }
  .wk i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }

  /* DAY */
  .day-head { margin: 18px 0 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; color: #fff; }
  .badge.str { background: var(--str); } .badge.run { background: var(--run); } .badge.mob { background: var(--mob); }
  .day-head h2 { font-size: 23px; margin: 0; letter-spacing: -0.02em; line-height: 1.18; }
  .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 13px; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--mob); transition: width .25s; }

  .note { background: var(--neutral-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }

  .block { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .block h3 {
    margin: 0; padding: 11px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); display: flex; justify-content: space-between; gap: 10px; background: var(--neutral-soft);
  }
  .block.s h3 { color: var(--str); background: var(--str-soft); }
  .block.r h3 { color: var(--run); background: var(--run-soft); }
  .block.m h3 { color: var(--mob); background: var(--mob-soft); }
  .block h3 span:last-child { white-space: nowrap; }
  .item { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-top: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative; }
  .item.hdr { cursor: default; }
  .item input[type="checkbox"] { position: absolute; opacity: 0; pointer-events: none; }
  .box {
    flex: 0 0 24px; height: 24px; border: 2px solid var(--line); border-radius: 8px; margin-top: 0;
    display: grid; place-items: center; transition: all .15s;
  }
  .item input:checked + .box { background: var(--mob); border-color: var(--mob); transform: scale(1.05); }
  .item input:checked + .box::after { content: "✓"; color: #fff; font-size: 15px; font-weight: 700; }
  .item input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  .txt { flex: 1; font-size: 16px; }
  .txt em { display: block; font-style: normal; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .item input:checked ~ .txt .tt, .item input:checked ~ .txt em { opacity: .45; text-decoration: line-through; }
  .pill { font-size: 13px; font-weight: 700; white-space: nowrap; padding: 3px 9px; border-radius: 99px; background: var(--neutral-soft); color: var(--text); }
  .block.s .pill { background: var(--str-soft); color: var(--str); }
  .item input:checked ~ .pill { opacity: .45; }
  .time { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; padding-top: 2px; }

  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 14px; padding: 12px; border-radius: 12px; cursor: pointer; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }

  .hist { margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .hist h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .hrow { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; color: var(--muted); }
  .hrow span { width: 44px; } .hrow b { width: 40px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .hbar { flex: 1; height: 10px; background: var(--neutral-soft); border-radius: 99px; overflow: hidden; }
  .hbar i { display: block; height: 100%; background: var(--mob); border-radius: 99px; }
  .hrow.cur .hbar i { background: var(--accent); } .hrow.cur span { color: var(--text); font-weight: 700; }
  .car { margin-top: 16px; }
  .slides { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .slides::-webkit-scrollbar { display: none; }
  .dn { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .dn i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dn i.on { background: var(--accent); }
  .goal { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--text); border-radius: 2px; }
  .goalline { margin-top: 6px; font-size: 13px; }
  .hero h4, .hist h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .ch { width: 100%; height: auto; display: block; } .ch text { font-size: 9px; fill: var(--muted); }
  .cap { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .wrow { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .wrow input { width: 72px; font: inherit; font-size: 16px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  .up { color: var(--mob); font-weight: 700; } .down { color: var(--accent); font-weight: 700; }
  select { width: 100%; font: inherit; font-size: 16px; padding: 9px 10px; margin: 4px 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  details { margin-top: 12px; font-size: 13px; } summary { cursor: pointer; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; } th, td { text-align: left; padding: 5px 4px; border-top: 1px solid var(--line); font-size: 12px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    transform: translate(-50%, 140%); background: var(--text); color: var(--bg);
    padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 20;
    transition: transform .3s ease; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <section class="car" aria-label="Desempenho da semana">
    <div class="slides" id="slides">
      <div class="hero" id="s1">
        <div class="hero-top">
          <div class="rank-emoji" id="rankEmoji">🏁</div>
          <div class="rank"><small>Nível da semana</small><b id="rankName">Largada</b></div>
          <div class="xp"><small>XP</small><b id="xp">0</b></div>
        </div>
        <div class="big-bar" aria-hidden="true"><i id="weekfill"></i><span class="goal" style="left:80%"></span></div>
        <div class="hero-meta"><span><b id="weekpct">0%</b> · meta 80%</span><span><b id="daysdone">0</b> de 7 dias completos</span></div>
        <div class="goalline" id="goalline"></div>
        <div class="prev" id="prev"></div>
      </div>
      <div class="hero" id="s2"></div>
      <div class="hero" id="s3"></div>
    </div>
    <div class="dn" id="dn"><i class="on"></i><i></i><i></i></div>
  </section>

  <nav><div class="tabs" id="tabs" role="tablist"></div><div class="wk"><i id="wk"></i></div></nav>
  <main id="day"></main>

  <section class="hist" id="hist"></section>
  <div class="actions">
    <button class="btn" id="resetDay">Limpar este dia</button>
    <button class="btn" id="resetAll">Nova semana</button>
  </div>
  <div class="actions">
    <button class="btn" id="bk">Copiar backup</button>
    <button class="btn" id="rs">Restaurar backup</button>
  </div>
  <p class="foot" id="sync">Salvo neste aparelho e navegador</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- PLANO ---------- */
const KW = { w: 1, c: 1, m: 2, r: 3, s: 3 };   // XP por tipo de item (x10)
const GOAL = 80;                                 // meta semanal (% do XP total)
const I = (t, o) => Object.assign({ t }, o || {});
const W_ = (label, time, items) => ({ k: "w", label, time, items });
const C_ = (time, items) => ({ k: "c", label: "Volta à calma", time, items });

const PLAN = [
  { n: 1, title: "Musculação (Superiores/Core) + Corrida", min: 70, types: ["str", "run"], blocks: [
    W_("Aquecimento", "5 min", [I("Caminhada rápida", { m: "5 min" }), I("Mobilidade de tornozelo, quadril e joelho")]),
    { k: "r", label: "Corrida na esteira", time: "25 min", items: [
      I("Corrida leve", { m: "25 min", s: "Ritmo confortável, inclinação 1%", km: 1 }) ]},
    { k: "s", label: "Musculação · Superiores & Core", time: "", items: [
      I("Lat Pulldown (puxada aberta)", { r: "3 × 12" }),
      I("Remada sentada na máquina", { r: "3 × 12" }),
      I("Supino inclinado", { r: "3 × 12", s: "Halter ou barra" }),
      I("Elevação lateral", { r: "3 × 15", s: "Halteres" }),
      I("Elevação frontal", { r: "3 × 15", i: "n1" }),
      I("Tríceps corda", { r: "4 × 10", i: "n2" }),
      I("Abdominal", { r: "3 × 15", i: "2.4", nw: 1 }) ]},
    C_("5 min", [I("Caminhada leve", { m: "5 min" }), I("Alongamento de panturrilhas, quadríceps e posterior de coxa"), I("Respiração profunda")])
  ]},
  { n: 2, title: "Musculação (Inferiores · Foco Quadríceps) + Mobilidade", min: 60, types: ["str", "mob"], blocks: [
    W_("Aquecimento", "3–5 min", [I("Caminhada leve ou bike", { m: "3–5 min" }), I("Mobilidade dinâmica de quadril")]),
    { k: "s", label: "Musculação · Inferiores (Quadríceps/Glúteo)", time: "", items: [
      I("Agachamento", { r: "4 × 10", s: "Barra Smith ou livre" }),
      I("Leg Press 45°", { r: "3 × 12" }),
      I("Cadeira extensora", { r: "3 × 12" }),
      I("Afundo", { r: "4 × 10", i: "n1" }),
      I("Cadeira adutora", { r: "3 × 15", i: "1.3" }),
      I("Panturrilha sentada", { r: "4 × 20", i: "1.4" }) ]},
    { k: "m", label: "Alongamento / Mobilidade", time: "15 min", items: [I("Quadril, flexores de coxa, coluna e ombros", { m: "15 min" })] },
    C_("", [I("Alongamento geral"), I("Respiração controlada")])
  ]},
  { n: 3, title: "Corrida na esteira · Tiros", min: 35, types: ["run"],
    note: "Sem musculação. Foco 100% no estímulo cardiovascular e na recuperação muscular dos membros superiores e inferiores.",
    blocks: [
    W_("Aquecimento", "5–8 min", [I("Caminhada rápida", { m: "5–8 min" }), I("2–3 arrancadas curtas", { m: "20–30 s" })]),
    { k: "r", label: "Corrida intervalada", time: "6 × 3 min", items: [
      I("6 tiros de 3 min", { s: "60 s de descanso entre cada tiro", hdr: true, km: 1 }),
      I("Tiro 1", { m: "3 min", w: 2 }), I("Tiro 2", { m: "3 min", w: 2 }), I("Tiro 3", { m: "3 min", w: 2 }),
      I("Tiro 4", { m: "3 min", w: 2 }), I("Tiro 5", { m: "3 min", w: 2 }), I("Tiro 6", { m: "3 min", w: 2 }) ]},
    C_("5 min", [I("Trote leve / caminhada", { m: "5 min" }), I("Alongamento de panturrilha, isquiotibiais e flexores do quadril")])
  ]},
  { n: 4, title: "Musculação (Inferiores · Foco Glúteo/Posterior)", min: 60, types: ["str"], blocks: [
    W_("Aquecimento", "5–10 min", [I("Aquecimento geral", { m: "5–10 min" }), I("Mobilidade de quadril, tornozelo e coluna torácica")]),
    { k: "s", label: "Musculação · Inferiores (Posterior/Glúteo)", time: "", items: [
      I("Elevação pélvica (máquina)", { r: "4 × 10" }),
      I("Cadeira ou cama flexora", { r: "4 × 12" }),
      I("Agachamento sumô", { r: "4 × 12", i: "n1" }),
      I("Cadeira abdutora", { r: "3 × 20", i: "1.3" }),
      I("Stiff", { r: "4 × 10", i: "n2" }),
      I("Glúteo na polia ou 4 apoios", { r: "4 × 10", i: "n3" }),
      I("Panturrilha sentada", { r: "4 × 20", i: "1.4" }) ]},
    C_("", [I("Alongamento leve"), I("Respiração diafragmática")])
  ]},
  { n: 5, title: "Corrida + Musculação (Superiores/Tanquinho) + Alongamento", min: 45, types: ["run", "str", "mob"], blocks: [
    W_("Aquecimento", "5 min", [I("Caminhada rápida", { m: "5 min" }), I("Mobilidade dinâmica de tornozelo e quadril")]),
    { k: "r", label: "Corrida na esteira", time: "30 min", items: [
      I("Corrida leve contínua", { m: "30 min", s: "Ritmo regenerativo, preparando para o longão", km: 1 }) ]},
    { k: "s", label: "Musculação · Braços, ombros & tanquinho", time: "15 min express", items: [
      I("Pec Deck", { r: "3 × 12" }),
      I("Desenvolvimento", { r: "3 × 12", i: "n1" }),
      I("Bíceps + tríceps (bi-set na polia)", { r: "3 × 12", i: "2.1" }),
      I("Remada unilateral", { r: "4 × 10", i: "n2" }),
      I("Barra na máquina", { r: "4 × 10", i: "n3" }),
      I("Elevação de pernas (infra)", { r: "3 × 15", i: "2.2", nw: 1 }),
      I("Prancha isométrica", { r: "3 × 45 s", i: "2.3", nw: 1 }) ]},
    { k: "m", label: "Alongamento / Mobilidade", time: "15 min", items: [I("Alongamento completo de tronco e pernas", { m: "15 min" })] },
    C_("5 min", [I("Caminhada leve", { m: "5 min" }), I("Respiração lenta")])
  ]},
  { n: 6, title: "Corrida longa no parque", min: 50, types: ["run"],
    note: "Sem musculação. Pernas descansadas do Dia 5 para performar nos 5 km.",
    blocks: [
    W_("Aquecimento", "8–10 min", [I("Trote leve / caminhada rápida", { m: "8–10 min" }), I("Mobilidade dinâmica")]),
    { k: "r", label: "Corrida contínua", time: "50 min", items: [I("Corrida contínua", { m: "50 min", s: "Seus 5 km no parque!", km: 1 })] },
    C_("5–10 min", [I("Caminhada", { m: "5–10 min" }), I("Alongamento completo de pernas")])
  ]},
  { n: 7, title: "Mobilidade e Recuperação", min: 25, types: ["mob"], blocks: [
    W_("Aquecimento", "3–5 min", [I("Caminhada leve", { m: "3–5 min" })]),
    { k: "m", label: "Mobilidade e alongamento", time: "20 min", items: [
      I("Mobilidade leve e alongamento", { m: "20 min", s: "Cadeia posterior, quadril, coluna torácica e lombar" }) ]},
    C_("", [I("Respiração lenta e relaxamento total")])
  ]}
];
const TLABEL = { str: "Musculação", run: "Corrida", mob: "Mobilidade" };
const iid = (bi, it, ii) => it.i || bi + "." + ii;

const DAYS_ITEMS = PLAN.map(d => {
  const out = [];
  d.blocks.forEach((b, bi) => b.items.forEach((it, ii) => { if (!it.hdr) out.push({ id: iid(bi, it, ii), w: (it.w || KW[b.k]) * 10 }); }));
  return out;
});
const MAXXP = DAYS_ITEMS.reduce((a, d) => a + d.reduce((s, x) => s + x.w, 0), 0);
const GOALXP = Math.ceil(MAXXP * GOAL / 100);

const EX = [];  // exercícios com carga
PLAN.forEach(d => d.blocks.forEach((b, bi) => b.items.forEach((it, ii) => {
  if (it.r && !it.nw) EX.push({ k: "d" + d.n + "_" + iid(bi, it, ii), n: it.t + " (Dia " + d.n + ")" });
})));

const RANKS = [
  { min: 0, e: "🏁", n: "Largada" }, { min: 1, e: "🔥", n: "Aquecendo" }, { min: 25, e: "👟", n: "Pegando ritmo" },
  { min: 50, e: "⚡", n: "Na zona" }, { min: GOAL, e: "🎯", n: "Meta batida" }, { min: 100, e: "🏆", n: "Lenda da semana" }
];

/* ---------- ESTADO ---------- */
const LS = "plano-treino-v2";
const $ = id => document.getElementById(id);
let state = { tab: 0, done: {}, loads: {}, km: {}, sel: null, startedAt: null, history: [], updatedAt: 0 };
function normalize(s) {
  const o = { tab: 0, done: {}, loads: {}, km: {}, sel: null, startedAt: null, history: [], updatedAt: 0 };
  if (!s || typeof s !== "object") return o;
  if (Number.isInteger(s.tab) && s.tab >= 0 && s.tab < 7) o.tab = s.tab;
  ["done", "loads", "km"].forEach(k => { if (s[k] && typeof s[k] === "object") o[k] = s[k]; });
  if (typeof s.sel === "string") o.sel = s.sel;
  if (typeof s.startedAt === "string") o.startedAt = s.startedAt;
  if (Array.isArray(s.history)) o.history = s.history.slice(-26);
  if (typeof s.updatedAt === "number") o.updatedAt = s.updatedAt;
  return o;
}
try { const raw = localStorage.getItem(LS); if (raw) state = normalize(JSON.parse(raw)); } catch (e) {}
function persist() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(state)); $("sync").textContent = "Salvo neste aparelho e navegador"; }
  catch (e) { $("sync").textContent = "⚠️ Não foi possível salvar (aba privada?)"; }
}

/* ---------- CÁLCULOS ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isNaN(n) ? null : n; };
const fmt = n => n.toLocaleString("pt-BR", { maximumFractionDigits: 1 });
const totalKm = km => Object.keys(km || {}).reduce((a, k) => a + (num(km[k]) || 0), 0);
const dlabel = h => h.date.slice(8, 10) + "/" + h.date.slice(5, 7);
function dayStats(di) {
  const set = new Set(state.done["d" + di] || []);
  let xp = 0, c = 0;
  DAYS_ITEMS[di].forEach(x => { if (set.has(x.id)) { xp += x.w; c++; } });
  return { c, total: DAYS_ITEMS[di].length, xp, complete: c === DAYS_ITEMS[di].length };
}
function weekStats() {
  let xp = 0, days = 0;
  PLAN.forEach((_, i) => { const s = dayStats(i); xp += s.xp; if (s.complete) days++; });
  return { xp, days, pct: Math.round(xp / MAXXP * 100) };
}
function prevLoad(k) {
  for (let i = state.history.length - 1; i >= 0; i--) {
    const v = num((state.history[i].loads || {})[k]);
    if (v != null) return v;
  }
  return null;
}
function deltaHTML(k, cur) {
  const p = prevLoad(k), c = num(cur);
  if (p == null) return "";
  let t = "ant. " + fmt(p) + " kg";
  if (c != null) {
    const d = Math.round((c - p) * 10) / 10;
    t += d > 0 ? ' · <span class="up">▲ +' + fmt(d) + '</span>' : d < 0 ? ' · <span class="down">▼ ' + fmt(d) + '</span>' : " · =";
  }
  return t;
}

/* ---------- GRÁFICOS (SVG) ---------- */
function chart(labels, vals, o) {
  o = o || {};
  const W = 300, H = 140, L = 30, R = 10, T = 16, B = 22, n = labels.length;
  const nums = vals.filter(v => v != null);
  const mx = o.max || Math.max.apply(null, [1].concat(nums)) * 1.25;
  const x = i => L + (i + .5) * (W - L - R) / n;
  const y = v => T + (H - T - B) * (1 - v / mx);
  const f = v => o.unit === "km" ? fmt(v) : Math.round(v) + (o.unit || "");
  let g = "";
  [0, .5, 1].forEach(p => { const v = mx * p;
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 4) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + Math.round(v) + '</text>'; });
  if (o.goal != null) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(o.goal) + '" y2="' + y(o.goal) + '" stroke="var(--mob)" stroke-dasharray="4 3"/><text x="' + (W - R) + '" y="' + (y(o.goal) - 3) + '" text-anchor="end" style="fill:var(--mob)">meta ' + o.goal + '%</text>';
  if (o.bars) {
    const bw = Math.min(26, (W - L - R) / n * .6);
    vals.forEach((v, i) => { if (v == null) return;
      g += '<rect x="' + (x(i) - bw / 2) + '" y="' + y(v) + '" width="' + bw + '" height="' + Math.max(1, y(0) - y(v)) + '" rx="4" fill="var(--accent)" opacity="' + (i === n - 1 ? 1 : .55) + '"/><text x="' + x(i) + '" y="' + (y(v) - 3) + '" text-anchor="middle">' + f(v) + '</text>'; });
  } else {
    let d = "";
    vals.forEach((v, i) => { if (v != null) d += (d ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); });
    g += '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    vals.forEach((v, i) => { if (v == null) return;
      g += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (i === n - 1 ? 4.5 : 3) + '" fill="var(--accent)"/><text x="' + x(i) + '" y="' + (y(v) - 7) + '" text-anchor="middle">' + f(v) + '</text>'; });
  }
  labels.forEach((l, i) => { g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + l + '</text>'; });
  return '<svg class="ch" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg>';
}

/* ---------- RENDER ---------- */
function renderHero() {
  const w = weekStats();
  let r = RANKS[0]; RANKS.forEach(x => { if (w.pct >= x.min) r = x; });
  $("rankEmoji").textContent = r.e; $("rankName").textContent = r.n;
  $("xp").textContent = w.xp + " / " + MAXXP;
  $("weekfill").style.width = w.pct + "%"; $("wk").style.width = w.pct + "%";
  $("weekpct").textContent = w.pct + "%"; $("daysdone").textContent = w.days;
  $("goalline").textContent = w.pct >= GOAL ? "🎯 Meta da semana batida!" : "Faltam " + (GOALXP - w.xp) + " XP para a meta de " + GOAL + "% (" + GOALXP + " XP)";
  const h = state.history, hs = h.slice(-7), last = h[h.length - 1];
  const prev = $("prev");
  if (last) {
    const d = w.pct - last.pct, best = Math.max.apply(null, h.map(x => x.pct));
    prev.style.display = "block";
    prev.innerHTML = "Semana anterior: <b>" + last.pct + "%</b> · Esta semana: <b>" + w.pct + "%</b> (" + (d >= 0 ? "+" : "") + d + " pts) · Melhor: " + best + "%";
  } else prev.style.display = "none";

  const sl = $("slides"), pos = sl.scrollLeft, labels = hs.map(dlabel).concat("Atual");
  $("s2").innerHTML = '<h4>Pontuação por semana</h4>' + chart(labels, hs.map(x => x.pct).concat(w.pct), { max: 100, goal: GOAL, unit: "%" }) +
    '<p class="cap">' + (last ? "Anterior " + last.pct + "% → atual " + w.pct + "% (" + (w.pct - last.pct >= 0 ? "+" : "") + (w.pct - last.pct) + " pts)" : "Arquive a primeira semana para ver a comparação.") + '</p>';
  const km = totalKm(state.km), lk = last && last.km != null ? last.km : null;
  $("s3").innerHTML = '<h4>Km corridos por semana</h4>' + chart(labels, hs.map(x => x.km == null ? null : x.km).concat(km), { bars: true, unit: "km" }) +
    '<p class="cap">Esta semana: ' + fmt(km) + ' km' + (lk != null ? " · semana anterior: " + fmt(lk) + " km" : "") + '</p>';
  sl.scrollLeft = pos;
}

function renderDash() {
  const k = EX.some(e => e.k === state.sel) ? state.sel : EX[0].k, hs = state.history.slice(-7);
  const vals = hs.map(h => num((h.loads || {})[k])).concat(num(state.loads[k]));
  const nn = vals.filter(v => v != null);
  let cap = nn.length ? "" : "Anote os pesos nos treinos para ver a evolução aqui.";
  if (nn.length > 1) { const d = Math.round((nn[nn.length - 1] - nn[0]) * 10) / 10; cap = "Do primeiro ao último registro: " + (d > 0 ? "▲ +" : d < 0 ? "▼ " : "= ") + fmt(d) + " kg"; }
  const rows = EX.map(e => {
    const p = prevLoad(e.k), c = num(state.loads[e.k]);
    return '<tr><td>' + esc(e.n) + '</td><td>' + (p == null ? "–" : fmt(p)) + '</td><td>' + (c == null ? "–" : fmt(c)) + '</td><td>' + (p != null && c != null ? deltaHTML(e.k, c).split("· ")[1] || "=" : "") + '</td></tr>';
  }).join("");
  $("hist").innerHTML = '<h4>Evolução de cargas</h4><select id="exsel">' +
    EX.map(e => '<option value="' + e.k + '"' + (e.k === k ? " selected" : "") + '>' + esc(e.n) + '</option>').join("") + '</select>' +
    chart(state.history.slice(-7).map(dlabel).concat("Atual"), vals, { unit: "" }) + '<p class="cap">' + cap + '</p>' +
    '<details><summary>Todas as cargas: semana anterior × atual</summary><table><tr><th>Exercício</th><th>Ant.</th><th>Atual</th><th></th></tr>' + rows + '</table></details>';
  $("exsel").addEventListener("change", e => { state.sel = e.target.value; persist(); renderDash(); });
}

function renderTabs(scroll) {
  const el = $("tabs");
  el.innerHTML = PLAN.map((d, i) => {
    const s = dayStats(i);
    return '<button class="tab' + (s.complete ? " done" : "") + '" role="tab" aria-selected="' + (i === state.tab) + '" data-i="' + i + '">' +
      '<small>Dia</small><b>' + d.n + '</b><span class="mini" style="width:' + Math.round(s.c / s.total * 100) + '%"></span></button>';
  }).join("");
  el.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    state.tab = +b.dataset.i; persist(); render(true);
    window.scrollTo({ top: document.querySelector("nav").offsetTop - 8, behavior: "smooth" });
  }));
  if (scroll) { const sel = el.querySelector('[aria-selected="true"]'); if (sel) el.scrollLeft = sel.offsetLeft - (el.clientWidth - sel.offsetWidth) / 2; }
}

function renderDay() {
  const i = state.tab, d = PLAN[i], s = dayStats(i), set = new Set(state.done["d" + i] || []);
  const badges = d.types.map(t => '<span class="badge ' + t + '">' + TLABEL[t] + '</span>').join("");
  const kmRow = '<div class="wrow"><input class="km" inputmode="decimal" placeholder="0" data-d="d' + d.n + '" value="' + esc(state.km["d" + d.n] || "") + '"><span>km corridos</span></div>';
  const blocks = d.blocks.map((b, bi) => {
    const rows = b.items.map((it, ii) => {
      if (it.hdr) return '<div class="item hdr"><div class="txt"><strong>' + esc(it.t) + '</strong><em>' + esc(it.s) + '</em>' + (it.km ? kmRow : "") + '</div></div>';
      const id = iid(bi, it, ii), k = "d" + d.n + "_" + id;
      const right = it.r ? '<span class="pill">' + esc(it.r) + '</span>' : (it.m ? '<span class="time">' + esc(it.m) + '</span>' : "");
      let extra = "";
      if (it.r && !it.nw) { const p = prevLoad(k);
        extra = '<div class="wrow"><input class="w" inputmode="decimal" data-k="' + k + '" placeholder="' + (p != null ? fmt(p) : "kg") + '" value="' + esc(state.loads[k] || "") + '"><span>kg</span><span class="dl" id="dl-' + k + '">' + deltaHTML(k, state.loads[k]) + '</span></div>'; }
      if (it.km) extra = kmRow;
      return '<label class="item"><input type="checkbox" data-id="' + id + '"' + (set.has(id) ? " checked" : "") + '><span class="box"></span>' +
        '<span class="txt"><span class="tt">' + esc(it.t) + '</span>' + (it.s ? '<em>' + esc(it.s) + '</em>' : "") + extra + '</span>' + right + '</label>';
    }).join("");
    return '<section class="block ' + b.k + '"><h3><span>' + esc(b.label) + '</span><span>' + esc(b.time || "") + '</span></h3>' + rows + '</section>';
  }).join("");
  $("day").innerHTML = '<div class="day-head"><div class="badges">' + badges + '</div><h2>' + esc(d.title) + '</h2>' +
    '<div class="meta"><span>' + d.min + ' min no total</span><span id="count">' + s.c + ' de ' + s.total + '</span></div>' +
    '<div class="bar"><i id="barfill" style="width:' + Math.round(s.c / s.total * 100) + '%"></i></div></div>' +
    (d.note ? '<div class="note">' + esc(d.note) + '</div>' : "") + blocks;

  document.querySelectorAll('#day input[type="checkbox"]').forEach(cb => cb.addEventListener("change", () => onCheck(cb)));
  document.querySelectorAll("#day input.w").forEach(inp => {
    inp.addEventListener("input", () => { state.loads[inp.dataset.k] = inp.value; persist(); $("dl-" + inp.dataset.k).innerHTML = deltaHTML(inp.dataset.k, inp.value); });
    inp.addEventListener("change", renderDash);
  });
  document.querySelectorAll("#day input.km").forEach(inp => {
    inp.addEventListener("input", () => { state.km[inp.dataset.d] = inp.value; persist(); });
    inp.addEventListener("change", renderHero);
  });
}

function onCheck(cb) {
  const k = "d" + state.tab, before = dayStats(state.tab).complete, w0 = weekStats().pct;
  const set = new Set(state.done[k] || []);
  cb.checked ? set.add(cb.dataset.id) : set.delete(cb.dataset.id);
  state.done[k] = Array.from(set);
  if (!state.startedAt) state.startedAt = new Date().toISOString();
  persist();
  const s = dayStats(state.tab);
  $("count").textContent = s.c + " de " + s.total;
  $("barfill").style.width = Math.round(s.c / s.total * 100) + "%";
  renderHero(); renderTabs(false);
  const w = weekStats().pct;
  if (w0 < 100 && w === 100) toast("🏆 Semana completa! Você é lenda.");
  else if (w0 < GOAL && w >= GOAL) toast("🎯 Meta de " + GOAL + "% batida!");
  else if (!before && s.complete) toast("🎉 Dia " + PLAN[state.tab].n + " completo! +" + s.xp + " XP");
}

let tt = null;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2800); }
function render(scrollTabs) { renderHero(); renderTabs(!!scrollTabs); renderDay(); renderDash(); }

$("slides").addEventListener("scroll", () => {
  const sl = $("slides"), i = Math.round(sl.scrollLeft / (sl.clientWidth + 12));
  document.querySelectorAll("#dn i").forEach((d, j) => d.classList.toggle("on", j === i));
}, { passive: true });

$("resetDay").addEventListener("click", () => { state.done["d" + state.tab] = []; persist(); render(); });
$("resetAll").addEventListener("click", () => {
  const w = weekStats(), km = totalKm(state.km);
  if (w.xp > 0 || km > 0 || Object.keys(state.loads).some(k => num(state.loads[k]) != null)) {
    state.history.push({ date: new Date().toISOString().slice(0, 10), pct: w.pct, days: w.days, xp: w.xp, km: Math.round(km * 10) / 10, loads: Object.assign({}, state.loads) });
    state.history = state.history.slice(-26);
  }
  state.done = {}; state.loads = {}; state.km = {}; state.tab = 0; state.startedAt = null;
  persist(); render(true); toast("Nova semana iniciada. Bora! 💪");
});
$("bk").addEventListener("click", async () => {
  const t = JSON.stringify(state);
  try { await navigator.clipboard.writeText(t); toast("Backup copiado. Cole no app Notas para guardar."); }
  catch (e) { prompt("Copie o backup abaixo:", t); }
});
$("rs").addEventListener("click", () => {
  const t = prompt("Cole aqui o backup:"); if (!t) return;
  try { state = normalize(JSON.parse(t)); persist(); render(true); toast("Backup restaurado."); }
  catch (e) { toast("Backup inválido."); }
});

render(true);

</script>
</body>
</html>
