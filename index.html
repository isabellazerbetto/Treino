<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" content="#e4572e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏃%3C/text%3E%3C/svg%3E">
<title>Meu plano de treino</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e4e2db;
    --accent: #e4572e; --accent-soft: #fde8e0;
    --str: #3b5bdb; --str-soft: #e7ecff;
    --run: #e4572e; --run-soft: #fde8e0;
    --mob: #2b9a66; --mob-soft: #e0f5ea;
    --neutral-soft: #efeee9;
    --gold: #f2b01e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --card: #1e1e1c; --text: #f2f1ec; --muted: #9c9a93; --line: #333330;
      --accent-soft: #3a211a; --str: #7b97ff; --str-soft: #1f2644; --run: #ff8a65; --run-soft: #3a211a;
      --mob: #4cc790; --mob-soft: #173326; --neutral-soft: #262624;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --card: #1e1e1c; --text: #f2f1ec; --muted: #9c9a93; --line: #333330;
    --accent-soft: #3a211a; --str: #7b97ff; --str-soft: #1f2644; --run: #ff8a65; --run-soft: #3a211a;
    --mob: #4cc790; --mob-soft: #173326; --neutral-soft: #262624;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  /* HERO */
  .hero { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
  .hero-top { display: flex; align-items: center; gap: 12px; }
  .rank-emoji { font-size: 34px; line-height: 1; }
  .rank small, .xp small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .rank b { font-size: 19px; letter-spacing: -0.01em; }
  .xp { margin-left: auto; text-align: right; }
  .xp b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .big-bar { height: 16px; background: var(--neutral-soft); border-radius: 99px; overflow: hidden; margin-top: 14px; position: relative; }
  .big-bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .4s ease;
    background: linear-gradient(90deg, var(--mob), var(--gold) 70%, var(--accent)); }
  .big-bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--card); opacity: .85; }
  .hero-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .hero-meta b { color: var(--text); }
  .prev { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); display: none; }

  /* NAV */
  nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); padding: 10px 0 0; margin: 12px -16px 0; border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; min-width: 50px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 7px 10px 8px; font: inherit; cursor: pointer; text-align: center; position: relative; overflow: hidden;
  }
  .tab small { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tab b { font-size: 17px; }
  .tab .mini { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--mob); width: 0; transition: width .3s; }
  .tab[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tab[aria-selected="true"] small { color: var(--bg); opacity: .7; }
  .tab.done { border-color: var(--mob); }
  .tab.done b::after { content: " ✓"; font-size: 12px; color: var(--mob); }
  .tab[aria-selected="true"].done b::after { color: var(--bg); }
  .wk { height: 3px; background: var(--line); }
  .wk i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }

  /* DAY */
  .day-head { margin: 18px 0 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; color: #fff; }
  .badge.str { background: var(--str); } .badge.run { background: var(--run); } .badge.mob { background: var(--mob); }
  .day-head h2 { font-size: 23px; margin: 0; letter-spacing: -0.02em; line-height: 1.18; }
  .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 13px; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--mob); transition: width .25s; }

  .note { background: var(--neutral-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }

  .block { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .block h3 {
    margin: 0; padding: 11px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); display: flex; justify-content: space-between; gap: 10px; background: var(--neutral-soft);
  }
  .block.s h3 { color: var(--str); background: var(--str-soft); }
  .block.r h3 { color: var(--run); background: var(--run-soft); }
  .block.m h3 { color: var(--mob); background: var(--mob-soft); }
  .block h3 span:last-child { white-space: nowrap; }
  .item { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-top: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative; }
  .item.hdr { cursor: default; }
  .item input { position: absolute; opacity: 0; pointer-events: none; }
  .box {
    flex: 0 0 24px; height: 24px; border: 2px solid var(--line); border-radius: 8px; margin-top: 0;
    display: grid; place-items: center; transition: all .15s;
  }
  .item input:checked + .box { background: var(--mob); border-color: var(--mob); transform: scale(1.05); }
  .item input:checked + .box::after { content: "✓"; color: #fff; font-size: 15px; font-weight: 700; }
  .item input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  .txt { flex: 1; font-size: 16px; }
  .txt em { display: block; font-style: normal; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .item input:checked ~ .txt { opacity: .45; text-decoration: line-through; }
  .pill { font-size: 13px; font-weight: 700; white-space: nowrap; padding: 3px 9px; border-radius: 99px; background: var(--neutral-soft); color: var(--text); }
  .block.s .pill { background: var(--str-soft); color: var(--str); }
  .item input:checked ~ .pill { opacity: .45; }
  .time { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; padding-top: 2px; }

  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 14px; padding: 12px; border-radius: 12px; cursor: pointer; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }

  .hist { margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .hist h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .hrow { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; color: var(--muted); }
  .hrow span { width: 44px; } .hrow b { width: 40px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .hbar { flex: 1; height: 10px; background: var(--neutral-soft); border-radius: 99px; overflow: hidden; }
  .hbar i { display: block; height: 100%; background: var(--mob); border-radius: 99px; }
  .hrow.cur .hbar i { background: var(--accent); } .hrow.cur span { color: var(--text); font-weight: 700; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    transform: translate(-50%, 140%); background: var(--text); color: var(--bg);
    padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 20;
    transition: transform .3s ease; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero" aria-label="Desempenho da semana">
    <div class="hero-top">
      <div class="rank-emoji" id="rankEmoji">🏁</div>
      <div class="rank"><small>Nível da semana</small><b id="rankName">Largada</b></div>
      <div class="xp"><small>XP</small><b id="xp">0</b></div>
    </div>
    <div class="big-bar" aria-hidden="true"><i id="weekfill"></i>
      <span class="tick" style="left:25%"></span><span class="tick" style="left:50%"></span><span class="tick" style="left:75%"></span>
    </div>
    <div class="hero-meta"><span><b id="weekpct">0%</b> da semana</span><span><b id="daysdone">0</b> de 7 dias completos</span></div>
    <div class="prev" id="prev"></div>
  </section>

  <nav><div class="tabs" id="tabs" role="tablist"></div><div class="wk"><i id="wk"></i></div></nav>
  <main id="day"></main>

  <section class="hist" id="hist"></section>
  <div class="actions">
    <button class="btn" id="resetDay">Limpar este dia</button>
    <button class="btn" id="resetAll">Nova semana</button>
  </div>
  <div class="actions">
    <button class="btn" id="bk">Copiar backup</button>
    <button class="btn" id="rs">Restaurar backup</button>
  </div>
  <p class="foot" id="sync">Salvo neste aparelho e navegador</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- PLANO ---------- */
const KW = { w: 1, c: 1, m: 2, r: 3, s: 3 };   // XP por tipo de item (x10)
const I = (t, o) => Object.assign({ t }, o || {});

const PLAN = [
  { n: 1, title: "Musculação (Superiores/Core) + Corrida", min: 70, types: ["str", "run"], blocks: [
    { k: "w", label: "Aquecimento", time: "5 min", items: [
      I("Caminhada rápida", { m: "5 min" }), I("Mobilidade de tornozelo, quadril e joelho") ]},
    { k: "r", label: "Corrida na esteira", time: "25 min", items: [
      I("Corrida leve", { m: "25 min", s: "Ritmo confortável, inclinação 1%" }) ]},
    { k: "s", label: "Musculação · Superiores & Core", time: "", items: [
      I("Lat Pulldown (puxada aberta)", { r: "3 × 12" }),
      I("Remada sentada na máquina", { r: "3 × 12" }),
      I("Supino inclinado", { r: "3 × 12", s: "Halter ou barra" }),
      I("Elevação lateral", { r: "3 × 15", s: "Halteres" }),
      I("Abdominal na máquina inclinada", { r: "3 × 15" }) ]},
    { k: "c", label: "Volta à calma", time: "5 min", items: [
      I("Caminhada leve", { m: "5 min" }),
      I("Alongamento de panturrilhas, quadríceps e posterior de coxa"),
      I("Respiração profunda") ]}
  ]},
  { n: 2, title: "Musculação (Inferiores · Foco Quadríceps) + Mobilidade", min: 60, types: ["str", "mob"], blocks: [
    { k: "w", label: "Aquecimento", time: "3–5 min", items: [
      I("Caminhada leve ou bike", { m: "3–5 min" }), I("Mobilidade dinâmica de quadril") ]},
    { k: "s", label: "Musculação · Inferiores (Quadríceps/Glúteo)", time: "", items: [
      I("Agachamento", { r: "4 × 10", s: "Barra Smith ou livre" }),
      I("Leg Press 45°", { r: "3 × 12" }),
      I("Cadeira extensora", { r: "3 × 12" }),
      I("Cadeira adutora", { r: "3 × 15" }),
      I("Panturrilha sentada", { r: "4 × 20" }) ]},
    { k: "m", label: "Alongamento / Mobilidade", time: "15 min", items: [
      I("Quadril, flexores de coxa, coluna e ombros", { m: "15 min" }) ]},
    { k: "c", label: "Volta à calma", time: "", items: [
      I("Alongamento geral"), I("Respiração controlada") ]}
  ]},
  { n: 3, title: "Corrida na esteira · Tiros", min: 35, types: ["run"],
    note: "Sem musculação. Foco 100% no estímulo cardiovascular e na recuperação muscular dos membros superiores e inferiores.",
    blocks: [
    { k: "w", label: "Aquecimento", time: "5–8 min", items: [
      I("Caminhada rápida", { m: "5–8 min" }), I("2–3 arrancadas curtas", { m: "20–30 s" }) ]},
    { k: "r", label: "Corrida intervalada", time: "6 × 3 min", items: [
      I("6 tiros de 3 min", { s: "60 s de descanso entre cada tiro", hdr: true }),
      I("Tiro 1", { m: "3 min", w: 2 }), I("Tiro 2", { m: "3 min", w: 2 }), I("Tiro 3", { m: "3 min", w: 2 }),
      I("Tiro 4", { m: "3 min", w: 2 }), I("Tiro 5", { m: "3 min", w: 2 }), I("Tiro 6", { m: "3 min", w: 2 }) ]},
    { k: "c", label: "Volta à calma", time: "5 min", items: [
      I("Trote leve / caminhada", { m: "5 min" }),
      I("Alongamento de panturrilha, isquiotibiais e flexores do quadril") ]}
  ]},
  { n: 4, title: "Musculação (Inferiores · Foco Glúteo/Posterior)", min: 60, types: ["str"], blocks: [
    { k: "w", label: "Aquecimento", time: "5–10 min", items: [
      I("Aquecimento geral", { m: "5–10 min" }), I("Mobilidade de quadril, tornozelo e coluna torácica") ]},
    { k: "s", label: "Musculação · Inferiores (Posterior/Glúteo)", time: "", items: [
      I("Elevação pélvica (máquina)", { r: "4 × 10" }),
      I("Cadeira ou cama flexora", { r: "4 × 12" }),
      I("Hack Squat", { r: "3 × 12", s: "Pés altos na plataforma" }),
      I("Cadeira abdutora", { r: "3 × 20" }),
      I("Panturrilha sentada", { r: "4 × 20" }) ]},
    { k: "c", label: "Volta à calma", time: "", items: [
      I("Alongamento leve"), I("Respiração diafragmática") ]}
  ]},
  { n: 5, title: "Corrida + Musculação (Superiores/Tanquinho) + Alongamento", min: 45, types: ["run", "str", "mob"], blocks: [
    { k: "w", label: "Aquecimento", time: "5 min", items: [
      I("Caminhada rápida", { m: "5 min" }), I("Mobilidade dinâmica de tornozelo e quadril") ]},
    { k: "r", label: "Corrida na esteira", time: "30 min", items: [
      I("Corrida leve contínua", { m: "30 min", s: "Ritmo regenerativo, preparando para o longão" }) ]},
    { k: "s", label: "Musculação · Braços, ombros & tanquinho", time: "15 min express", items: [
      I("Pec Deck ou desenvolvimento", { r: "3 × 12" }),
      I("Bíceps + tríceps (bi-set na polia)", { r: "3 × 12" }),
      I("Elevação de pernas (infra)", { r: "3 × 15" }),
      I("Prancha isométrica", { r: "3 × 45 s" }) ]},
    { k: "m", label: "Alongamento / Mobilidade", time: "15 min", items: [
      I("Alongamento completo de tronco e pernas", { m: "15 min" }) ]},
    { k: "c", label: "Volta à calma", time: "5 min", items: [
      I("Caminhada leve", { m: "5 min" }), I("Respiração lenta") ]}
  ]},
  { n: 6, title: "Corrida longa no parque", min: 50, types: ["run"],
    note: "Sem musculação. Pernas descansadas do Dia 5 para performar nos 5 km.",
    blocks: [
    { k: "w", label: "Aquecimento", time: "8–10 min", items: [
      I("Trote leve / caminhada rápida", { m: "8–10 min" }), I("Mobilidade dinâmica") ]},
    { k: "r", label: "Corrida contínua", time: "50 min", items: [
      I("Corrida contínua", { m: "50 min", s: "Seus 5 km no parque!" }) ]},
    { k: "c", label: "Volta à calma", time: "5–10 min", items: [
      I("Caminhada", { m: "5–10 min" }), I("Alongamento completo de pernas") ]}
  ]},
  { n: 7, title: "Mobilidade e Recuperação", min: 25, types: ["mob"], blocks: [
    { k: "w", label: "Aquecimento", time: "3–5 min", items: [ I("Caminhada leve", { m: "3–5 min" }) ]},
    { k: "m", label: "Mobilidade e alongamento", time: "20 min", items: [
      I("Mobilidade leve e alongamento", { m: "20 min", s: "Cadeia posterior, quadril, coluna torácica e lombar" }) ]},
    { k: "c", label: "Volta à calma", time: "", items: [ I("Respiração lenta e relaxamento total") ]}
  ]}
];
const TLABEL = { str: "Musculação", run: "Corrida", mob: "Mobilidade" };

/* ids e pesos */
function dayItems(di) {
  const out = [];
  PLAN[di].blocks.forEach((b, bi) => b.items.forEach((it, ii) => {
    if (it.hdr) return;
    out.push({ id: bi + "." + ii, w: (it.w || KW[b.k]) * 10 });
  }));
  return out;
}
const DAYS_ITEMS = PLAN.map((_, i) => dayItems(i));
const MAXXP = DAYS_ITEMS.reduce((a, d) => a + d.reduce((s, x) => s + x.w, 0), 0);

const RANKS = [
  { min: 0,   e: "🏁", n: "Largada" },
  { min: 1,   e: "🔥", n: "Aquecendo" },
  { min: 25,  e: "👟", n: "Pegando ritmo" },
  { min: 50,  e: "⚡", n: "Na zona" },
  { min: 75,  e: "🚀", n: "Quase lá" },
  { min: 100, e: "🏆", n: "Lenda da semana" }
];

/* ---------- ESTADO ---------- */
const LS = "plano-treino-v2";
let state = { tab: 0, done: {}, startedAt: null, history: [], updatedAt: 0 };
function normalize(s) {
  const o = { tab: 0, done: {}, startedAt: null, history: [], updatedAt: 0 };
  if (!s || typeof s !== "object") return o;
  if (Number.isInteger(s.tab) && s.tab >= 0 && s.tab < 7) o.tab = s.tab;
  if (s.done && typeof s.done === "object") o.done = s.done;
  if (typeof s.startedAt === "string") o.startedAt = s.startedAt;
  if (Array.isArray(s.history)) o.history = s.history.slice(-12);
  if (typeof s.updatedAt === "number") o.updatedAt = s.updatedAt;
  return o;
}
try { const raw = localStorage.getItem(LS); if (raw) state = normalize(JSON.parse(raw)); } catch (e) {}

function setSync(msg) { document.getElementById("sync").textContent = msg; }
function persist() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(state)); setSync("Salvo neste aparelho e navegador"); }
  catch (e) { setSync("⚠️ Não foi possível salvar (aba privada?)"); }
}

/* ---------- CÁLCULOS ---------- */
function dayStats(di) {
  const set = new Set(state.done["d" + di] || []);
  const items = DAYS_ITEMS[di];
  let xp = 0, c = 0;
  items.forEach(x => { if (set.has(x.id)) { xp += x.w; c++; } });
  return { c, total: items.length, xp, complete: c === items.length };
}
function weekStats() {
  let xp = 0, days = 0;
  PLAN.forEach((_, i) => { const s = dayStats(i); xp += s.xp; if (s.complete) days++; });
  return { xp, days, pct: Math.round(xp / MAXXP * 100) };
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ---------- RENDER ---------- */
function renderHero() {
  const w = weekStats();
  let r = RANKS[0];
  RANKS.forEach(x => { if (w.pct >= x.min) r = x; });
  document.getElementById("rankEmoji").textContent = r.e;
  document.getElementById("rankName").textContent = r.n;
  document.getElementById("xp").textContent = w.xp + " / " + MAXXP;
  document.getElementById("weekfill").style.width = w.pct + "%";
  document.getElementById("wk").style.width = w.pct + "%";
  document.getElementById("weekpct").textContent = w.pct + "%";
  document.getElementById("daysdone").textContent = w.days;
  const prev = document.getElementById("prev");
  const h = state.history;
  if (h.length) {
    const last = h[h.length - 1], d = w.pct - last.pct;
    const best = Math.max.apply(null, h.map(x => x.pct));
    prev.style.display = "block";
    prev.innerHTML = "Semana anterior: <b>" + last.pct + "%</b> · Esta semana: <b>" + w.pct + "%</b> (" + (d >= 0 ? "+" : "") + d + " pts) · Melhor: " + best + "%";
  } else { prev.style.display = "none"; }
  renderHist(w);
}

function renderHist(w) {
  const rows = state.history.slice(-7).map(x => ({ l: x.date.slice(8, 10) + "/" + x.date.slice(5, 7), p: x.pct, cur: false }));
  rows.push({ l: "Atual", p: w.pct, cur: true });
  document.getElementById("hist").innerHTML = '<h4>Histórico de semanas</h4>' + rows.map(r =>
    '<div class="hrow' + (r.cur ? " cur" : "") + '"><span>' + r.l + '</span><div class="hbar"><i style="width:' + r.p + '%"></i></div><b>' + r.p + '%</b></div>').join("");
}

function renderTabs(scroll) {
  const el = document.getElementById("tabs");
  el.innerHTML = PLAN.map((d, i) => {
    const s = dayStats(i);
    return '<button class="tab' + (s.complete ? " done" : "") + '" role="tab" aria-selected="' + (i === state.tab) + '" data-i="' + i + '">' +
      '<small>Dia</small><b>' + d.n + '</b><span class="mini" style="width:' + Math.round(s.c / s.total * 100) + '%"></span></button>';
  }).join("");
  el.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    state.tab = +b.dataset.i; persist(); render(true);
    window.scrollTo({ top: document.querySelector("nav").offsetTop - 8, behavior: "smooth" });
  }));
  if (scroll) {
    const sel = el.querySelector('[aria-selected="true"]');
    if (sel) el.scrollLeft = sel.offsetLeft - (el.clientWidth - sel.offsetWidth) / 2;
  }
}

function renderDay() {
  const i = state.tab, d = PLAN[i], s = dayStats(i);
  const set = new Set(state.done["d" + i] || []);
  const badges = d.types.map(t => '<span class="badge ' + t + '">' + TLABEL[t] + '</span>').join("");
  const blocks = d.blocks.map((b, bi) => {
    const rows = b.items.map((it, ii) => {
      if (it.hdr) return '<div class="item hdr"><div class="txt"><strong>' + esc(it.t) + '</strong><em>' + esc(it.s) + '</em></div></div>';
      const id = bi + "." + ii;
      const right = it.r ? '<span class="pill">' + esc(it.r) + '</span>' : (it.m ? '<span class="time">' + esc(it.m) + '</span>' : "");
      return '<label class="item"><input type="checkbox" data-id="' + id + '"' + (set.has(id) ? " checked" : "") + '><span class="box"></span>' +
        '<span class="txt">' + esc(it.t) + (it.s ? '<em>' + esc(it.s) + '</em>' : "") + '</span>' + right + '</label>';
    }).join("");
    return '<section class="block ' + b.k + '"><h3><span>' + esc(b.label) + '</span><span>' + esc(b.time || "") + '</span></h3>' + rows + '</section>';
  }).join("");
  document.getElementById("day").innerHTML =
    '<div class="day-head"><div class="badges">' + badges + '</div><h2>' + esc(d.title) + '</h2>' +
    '<div class="meta"><span>' + d.min + ' min no total</span><span id="count">' + s.c + ' de ' + s.total + '</span></div>' +
    '<div class="bar"><i id="barfill" style="width:' + Math.round(s.c / s.total * 100) + '%"></i></div></div>' +
    (d.note ? '<div class="note">' + esc(d.note) + '</div>' : "") + blocks;

  document.querySelectorAll('#day input[type="checkbox"]').forEach(cb => cb.addEventListener("change", () => onCheck(cb)));
}

function onCheck(cb) {
  const k = "d" + state.tab;
  const before = dayStats(state.tab).complete, wasFull = weekStats().pct === 100;
  const set = new Set(state.done[k] || []);
  cb.checked ? set.add(cb.dataset.id) : set.delete(cb.dataset.id);
  state.done[k] = Array.from(set);
  if (!state.startedAt) state.startedAt = new Date().toISOString();
  persist();
  const s = dayStats(state.tab);
  document.getElementById("count").textContent = s.c + " de " + s.total;
  document.getElementById("barfill").style.width = Math.round(s.c / s.total * 100) + "%";
  renderHero(); renderTabs(false);
  const w = weekStats();
  if (!wasFull && w.pct === 100) toast("🏆 Semana completa! Você é lenda.");
  else if (!before && s.complete) toast("🎉 Dia " + PLAN[state.tab].n + " completo! +" + s.xp + " XP");
}

let tt = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2800);
}

function render(scrollTabs) { renderHero(); renderTabs(!!scrollTabs); renderDay(); }

document.getElementById("resetDay").addEventListener("click", () => {
  state.done["d" + state.tab] = []; persist(); render();
});
document.getElementById("resetAll").addEventListener("click", () => {
  const w = weekStats();
  if (w.xp > 0) {
    state.history.push({ date: new Date().toISOString().slice(0, 10), pct: w.pct, days: w.days });
    state.history = state.history.slice(-12);
  }
  state.done = {}; state.tab = 0; state.startedAt = null;
  persist(); render(true);
  toast("Nova semana iniciada. Bora! 💪");
});

document.getElementById("bk").addEventListener("click", async () => {
  const t = JSON.stringify(state);
  try { await navigator.clipboard.writeText(t); toast("Backup copiado. Cole no app Notas para guardar."); }
  catch (e) { prompt("Copie o backup abaixo:", t); }
});
document.getElementById("rs").addEventListener("click", () => {
  const t = prompt("Cole aqui o backup:");
  if (!t) return;
  try { state = normalize(JSON.parse(t)); persist(); render(true); toast("Backup restaurado."); }
  catch (e) { toast("Backup inválido."); }
});

render(true);
</script>
</body>
</html>
